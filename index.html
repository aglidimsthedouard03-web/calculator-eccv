function appendValue(value){

	  expression.innerText += value;
	  display.value += value;

}

function factorial(n){
    if(n < 0) return NaN;

    let r = 1;

    for(let i = 2; i <= n; i++){
        r *= i;
    }

    return r;
}
	 
let angleMode = "DEG";

function setAngleMode(mode){

    angleMode = mode;

    const degBtn = document.getElementById("degBtn");
    const radBtn = document.getElementById("radBtn");

    // Reset
    degBtn.style.background = "#ffffff";
    radBtn.style.background = "#ffffff";

    degBtn.style.color = "#000000";
    radBtn.style.color = "#000000";

    // Bouton aktif
    if(mode === "DEG"){
        degBtn.style.background = "#4f46e5";
        degBtn.style.color = "#ffffff";
    }else{
        radBtn.style.background = "#4f46e5";
        radBtn.style.color = "#ffffff";
    }

    // Si Dark Mode aktive
    if(document.body.classList.contains("dark")){

        degBtn.style.background =
            mode === "DEG" ? "#4f46e5" : "#333";

        radBtn.style.background =
            mode === "RAD" ? "#4f46e5" : "#333";

        degBtn.style.color = "#ffffff";
        radBtn.style.color = "#ffffff";
    }
}
	 
function calculate(){
        
		  try{
		  
		let exp = 
document.getElementById("display").value;
   
    let originalExp = exp;
		
exp = exp.replaceAll("π","Math.PI");

exp = exp.replaceAll("log(","Math.log10(");
if(angleMode === "DEG"){

exp = exp.replaceAll(
"sin(",
"Math.sin(Math.PI/180*"
);

exp = exp.replaceAll(
"cos(",
"Math.cos(Math.PI/180*"
);

exp = exp.replaceAll(
"tan(",
"Math.tan(Math.PI/180*"
);

}else{

exp = exp.replaceAll("sin(","Math.sin(");
exp = exp.replaceAll("cos(","Math.cos(");
exp = exp.replaceAll("tan(","Math.tan(");

}

exp = exp.replaceAll("ln(","Math.log(");
exp = exp.replaceAll("√(","Math.sqrt(");
exp = exp.replaceAll("e","Math.E");

exp = exp.replaceAll("asin(","Math.asin(");
exp = exp.replaceAll("acos(","Math.acos(");
exp = exp.replaceAll("atan(","Math.atan(");

exp = exp.replaceAll("sinh(","Math.sinh(");
exp = exp.replaceAll("cosh(","Math.cosh(");
exp = exp.replaceAll("tanh(","Math.tanh(");

exp = exp.replaceAll("rand()","Math.random()");
exp = exp.replaceAll("exp(","Math.exp(");
exp = exp.replace(/(\d+)!/g, (_, n) =>
    factorial(parseInt(n))
);

exp = exp.replaceAll("abs(","Math.abs(");
exp = exp.replaceAll("floor(","Math.floor(");
exp = exp.replaceAll("ceil(","Math.ceil(");
 
 //Fèmen parantèz otomatikman
 
 let openCount = 
 (exp.match(/\(/g) || []).length;
 
 let closeCount =
 (exp.match(/\)/g) || []).length;
 
 while(closeCount < openCount){
 
     exp += ")";
	 closeCount++;
}
 
        console.log(exp);
        let result = eval(exp);
		
document.getElementById("result").innerText = result;

document.getElementById("display").value = result;
  
           addToHistory(
		      originalExp + " = " + result);

        }catch(error){
		
document.getElementById("result").innerText = "Erreur";

      }
 }

async function solveMath(){

    const question =
        document.getElementById("question").value;

    const response = await fetch(
        "URL_API_OU",
        {
            method:"POST",
            headers:{
                "Content-Type":"application/json",
                "Authorization":"Bearer API_KEY_OU"
            },
            body:JSON.stringify({
                model:"gpt-4.1-mini",
                messages:[
                    {
                        role:"system",
                        content:"Ou se yon pwofesè matematik. Bay etap rezolisyon yo ak repons final la."
                    },
                    {
                        role:"user",
                        content:question
                    }
                ]
            })
        }
    );

    const data = await response.json();

    document.getElementById("answer").innerHTML =
        data.choices[0].message.content;
}
